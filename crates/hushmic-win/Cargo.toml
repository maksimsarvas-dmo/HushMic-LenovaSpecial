[package]
name = "hushmic-win"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version = "1.88"
description = "Windows WASAPI + Intel NPU (OpenVINO) / ONNX Runtime engine for HushMic DPDFNet noise suppression"
repository = "https://github.com/Fovty/HushMic"

[[bin]]
name = "hushmic-win"
path = "src/main.rs"

[dependencies]
hushmic-denoiser = { path = "../hushmic-denoiser", features = ["npu"] }
directories = "6"
hound = "3.5.1"
rubato = "0.16"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"

[target.'cfg(windows)'.dependencies]
wasapi = "0.17"
tray-icon = "0.19"
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_IO",
  "Win32_System_Pipes",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_UI_WindowsAndMessaging",
] }
